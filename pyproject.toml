[project]
name = "gemini-web-tool-calling"
version = "0.1.0"
description = "qwen-tool-calling behind a web server: FastAPI + LiteLLM + Gemini, with tool calls shown in the UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tool tests run offline against the snapshot. The live USDA check runs only with: pytest -m live
markers = ["live: calls the real USDA API (needs USDA_API_KEY and network)"]
addopts = "-m 'not live'"
pythonpath = ["."]
